<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — MilkWell</title>
  <meta name="description" content="Get help with the MilkWell app, bags, tags and orders.">
  <link rel="canonical" href="https://app.eatplayloveco.com/contactus/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: #FFFBF4;
      color: #2C201A;
      padding: 2.5rem 1.25rem 3rem;
      -webkit-text-size-adjust: 100%;
    }
    .top { text-align: center; margin-bottom: 2rem; }
    .wordmark { font-family: 'Instrument Serif', serif; font-size: 2.4rem; letter-spacing: -0.02em; color: #2C201A; text-decoration: none; }
    .tagline { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.05rem; color: #C47B2B; margin-top: 0.2rem; }
    .card {
      background: #fff; border-radius: 16px; box-shadow: 0 1px 8px rgba(44,32,26,0.06);
      max-width: 680px; margin: 0 auto; padding: 2.25rem 1.75rem;
    }
    .card-label { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: #C47B2B; margin-bottom: 0.6rem; }
    h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 2rem; line-height: 1.15; margin-bottom: 1.25rem; }
    p { font-weight: 300; font-size: 1rem; line-height: 1.7; margin-bottom: 0.9rem; }
    a { color: #A8651F; }
    .nav { max-width: 680px; margin: 2rem auto 0; text-align: center; font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; }
    .nav a { color: #C47B2B; text-decoration: none; margin: 0 0.7rem; display: inline-block; padding: 0.4rem 0; }
    .nav a[aria-current] { color: #2C201A; }
    .footer { margin-top: 1.5rem; text-align: center; font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: #C9B39E; }
    @media (min-width: 600px) { .card { padding: 2.75rem 3rem; } }
  </style>
</head>
<body>
  <div class="top">
    <div class="wordmark">MilkWell</div>
    <div class="tagline">Your milk, kept well.</div>
  </div>
  <main class="card">
    <div class="card-label">Help</div>
    <h1>Contact Us</h1>
    <p>Questions about the MilkWell app, your bags and tags, or an order? Email us and we'll help.</p>
    <p><a href="mailto:support@eatplayloveco.com">support@eatplayloveco.com</a></p>
  </main>
  <nav class="nav">
    <a href="/privacy/">Privacy</a>
    <a href="/terms/">Terms</a>
    <a href="/contactus/" aria-current="page">Contact</a>
  </nav>
  <div class="footer">Eat Play Love Co. LLC · Smart Milk Storage</div>
</body>
</html>
